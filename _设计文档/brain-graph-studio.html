<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>JobHunter MasterGraph · LangGraph Studio 视图</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2128; --border: #30363d;
    --text: #e6edf3; --dim: #8b949e;
    --llm: #8957e5; --component: #58a6ff; --tool: #3fb950; --human: #d29922;
    --judge: #e3b341; --start: #3fb950; --end: #f85149;
    --hl: #ffd33d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; height: 100vh; display: flex; flex-direction: column; }
  /* 顶栏（Studio 风格） */
  .topbar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
  .logo { font-weight: 700; font-size: 14px; color: var(--component); }
  .logo b { color: var(--judge); }
  .crumb { color: var(--dim); }
  .tag { padding: 2px 10px; border-radius: 12px; font-size: 11px; border: 1px solid var(--border); color: var(--dim); }
  .tag.focus { border-color: var(--hl); color: var(--hl); }
  .spacer { flex: 1; }
  .btn { padding: 4px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel2); color: var(--text); cursor: pointer; font-size: 12px; }
  .btn:hover { border-color: var(--component); }
  /* 主区 */
  .main { flex: 1; display: flex; overflow: hidden; }
  .canvas { flex: 1; position: relative; overflow: auto; }
  svg { width: 1280px; height: 600px; display: block; }
  /* 节点 */
  .node rect { rx: 10; ry: 10; stroke-width: 1.5; fill: var(--panel2); }
  .node.focus rect { stroke: var(--hl); stroke-width: 2.5; filter: drop-shadow(0 0 8px rgba(255,211,61,.35)); }
  .node .t { font-size: 13px; font-weight: 600; fill: var(--text); }
  .node .s { font-size: 10px; fill: var(--dim); }
  .node .badge { font-size: 9px; }
  /* 边 */
  .edge path { fill: none; stroke: #484f58; stroke-width: 1.4; marker-end: url(#arrow); }
  .edge.focus path { stroke: var(--hl); stroke-width: 2.2; }
  .edge.dash path { stroke-dasharray: 6 4; }
  .edge .lbl { font-size: 10px; fill: var(--dim); }
  .edge.focus .lbl { fill: var(--hl); }
  /* Inspector */
  .inspector { width: 340px; border-left: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; overflow-y: auto; }
  .insp-header { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .insp-header .id { font-size: 11px; color: var(--dim); }
  .insp-header .name { font-size: 16px; font-weight: 700; margin: 2px 0 6px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; }
  .b-llm { background: rgba(137,87,229,.18); color: var(--llm); }
  .b-component { background: rgba(88,166,255,.15); color: var(--component); }
  .b-tool { background: rgba(63,185,80,.15); color: var(--tool); }
  .b-human { background: rgba(210,153,34,.15); color: var(--human); }
  .b-judge { background: rgba(227,179,65,.15); color: var(--judge); }
  .b-start { background: rgba(63,185,80,.15); color: var(--start); }
  .b-end { background: rgba(248,81,73,.15); color: var(--end); }
  /* 审核结果卡片（N3 review_results 展示） */
  .rv { display: flex; align-items: center; gap: 8px; padding: 4px 8px; margin: 3px 0; background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; font-size: 12px; }
  .rv-b { color: var(--dim); width: 88px; }
  .rv-v { padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .rv-pass { background: rgba(63,185,80,.18); color: var(--start); }
  .rv-warn { background: rgba(227,179,65,.18); color: var(--judge); }
  .rv-blk { color: var(--end); font-weight: 700; }
  .rv-rw { color: var(--hl); font-style: normal; }
  .insp-body { padding: 12px 16px; }
  .sec { margin-bottom: 14px; }
  .sec h4 { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  .sec p, .sec li { font-size: 12.5px; color: var(--text); }
  .sec ul { padding-left: 16px; }
  .sec code { background: var(--panel2); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; font-size: 11px; color: var(--component); }
  .kv { display: flex; gap: 8px; padding: 3px 0; border-bottom: 1px dashed #21262d; font-size: 12px; }
  .kv .k { color: var(--dim); min-width: 90px; }
  .kv .v { color: var(--text); }
  .hl { color: var(--hl); font-weight: 600; }
  .foot { padding: 10px 16px; border-top: 1px solid var(--border); font-size: 11px; color: var(--dim); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 6px 16px; background: var(--panel); border-top: 1px solid var(--border); font-size: 11px; color: var(--dim); }
  .legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 4px; vertical-align: middle; }
</style>
</head>
<body>

<div class="topbar">
  <span class="logo">JobHunter <b>MasterGraph</b></span>
  <span class="crumb">/ graph / brain</span>
  <span class="tag focus">● 焦点：N5/N7/N8 匹配反馈环</span>
  <span class="tag">LangGraph Studio 视图</span>
  <span class="spacer"></span>
  <span class="tag">v2.0 · 2026-08-14</span>
</div>

<div class="main">
  <div class="canvas">
    <svg id="graph" viewBox="0 0 1280 600"></svg>
  </div>

  <div class="inspector">
    <div class="insp-header" id="inspHeader"></div>
    <div class="insp-body" id="inspBody"></div>
    <div class="foot" id="inspFoot"></div>
  </div>
</div>

<div class="legend">
  <span><span class="dot" style="background:var(--llm)"></span>LLM 节点</span>
  <span><span class="dot" style="background:var(--component)"></span>LangChain 组件</span>
  <span><span class="dot" style="background:var(--tool)"></span>HTTP 工具 / 工具</span>
  <span><span class="dot" style="background:var(--human)"></span>人工（interrupt）</span>
  <span><span class="dot" style="background:var(--judge)"></span>规则判定</span>
  <span><span class="dot" style="background:var(--hl)"></span>高亮 = 当前讨论的反馈环</span>
</div>

    io:["输入：company / resumeVer / ocrProjects / jdText / profileHints", "输出：7 文件 + 面经来源 + 术语映射"] },
  N9:    { x:800, y:430, w:170, type:"human", name:"N9 投递简历", sub:"人工 interrupt",

    io:["交互：投递完成 → N10；要求改简历 → N8"] },
  N10:   { x:580, y:430, w:170, type:"tool", name:"N10 tracker", sub:"工具",

  N11:   { x:180, y:430, w:150, type:"llm", name:"N11 总报告", sub:"LLM",

    io:["输出：report"] },

  { f:"START", t:"N1", label:"" },
  { f:"N1", t:"N2", label:"" },
  { f:"N2", t:"N1B", label:"缺" },
  { f:"N1B", t:"N1", label:"追问完善", dash:true },

  { f:"N4", t:"N5", label:"" },
  { f:"N5", t:"N6", label:"达标" },

  { f:"N5", t:"N12", label:"轮次已满" },
  { f:"N12", t:"N6", label:"降级标记" },
  { f:"N6", t:"N9", label:"" },
  { f:"N9", t:"N10", label:"投递完成/跳过" },

  { f:"N10", t:"N10B", label:"" },
  { f:"N10B", t:"N11", label:"" },
  { f:"N11", t:"END", label:"" },

// ---------- mock review_results（与 resume_agent 组件输出结构一致，仅本地演示） ----------
const MOCK_REVIEW = [
  { block: "summary",     verdict: "pass",              rounds: 0, rewritten: false, blockerCount: 0, issues: [] },
  { block: "internship",  verdict: "pass",              rounds: 0, rewritten: false, blockerCount: 0, issues: [] },
  { block: "projects",    verdict: "accept_with_issues", rounds: 1, rewritten: true, blockerCount: 2,
    issues: ["star_chain：要点条数 3 不足 STAR 四段（S/T/A/R 各需 1 条）",
             "density_min：单条等效字 20 低于下限 35"] },
  { block: "skill_extend", verdict: "pass",             rounds: 0, rewritten: false, blockerCount: 0, issues: [] },
];
function reviewHtml() {
  return MOCK_REVIEW.map(r => {
    const cls = r.verdict === "pass" ? "rv-pass" : "rv-warn";
    const blk = r.blockerCount ? ` <b class="rv-blk">${r.blockerCount} 个 blocker</b>` : "";
    const rw = r.rewritten ? ` <em class="rv-rw">已带意见重写 ${r.rounds} 轮</em>` : "";
    return `<div class="rv"><span class="rv-b">${r.block}</span><span class="rv-v ${cls}">${r.verdict}</span>${blk}${rw}</div>`;
  }).join("");
}

      ["版本绑定", "问题库按 (resumeVer, tech, company, jobTitle) 索引，旧版本仅模式参考（降权）"],
    ],
    io:{ in:"面试文字/语音转写 + 元数据", out:"问题库 + user_report + profileHints" },
  },
};

// ---------- SVG 渲染 ----------
const svg = document.getElementById("graph");
const NS = "http://www.w3.org/2000/svg";
svg.insertAdjacentHTML("beforeend",
  '<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
  '<path d="M0,0 L10,5 L0,10 z" fill="#484f58"/></marker>' +
  '<marker id="arrowHl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
  '<path d="M0,0 L10,5 L0,10 z" fill="#ffd33d"/></marker></defs>');

const typeColor = { llm:"#8957e5", component:"#58a6ff", tool:"#3fb950", human:"#d29922", judge:"#e3b341", start:"#3fb950", end:"#f85149" };

// 边
const edgeEls = [];
for (const e of EDGES) {
  const a = NODES[e.f], b = NODES[e.t];
  const ax = a.x + a.w/2, ay = a.y + (a.type==="judge" ? 62 : 32);
  const bx = b.x + b.w/2, by = b.y + (b.type==="judge" ? 0 : 0);
  const cls = "edge" + (e.focus ? " focus" : "") + (e.dash ? " dash" : "");
  const g = document.createElementNS(NS, "g"); g.setAttribute("class", cls);
  const path = document.createElementNS(NS, "path");
  // 折线：水平出/入 + 中间垂直
  const midY = ay + (by - ay) / 2;
  const dx = Math.abs(bx - ax);
  if (by > ay && dx < 80) { // 垂直小跨度
    path.setAttribute("d", `M${ax},${ay} L${ax},${by}`);
  } else {
    const bend = Math.max(30, dx / 2);
    path.setAttribute("d", `M${ax},${ay} C${ax+bend},${ay} ${bx-bend},${by} ${bx},${by}`);
  }
  path.setAttribute("fill","none");
  path.setAttribute("marker-end", e.focus ? "url(#arrowHl)" : "url(#arrow)");
  g.appendChild(path);
  if (e.label) {
    const t = document.createElementNS(NS,"text"); t.setAttribute("class","lbl");
    const lx = (ax+bx)/2, ly = (ay+by)/2 - 6;
    t.setAttribute("x", lx); t.setAttribute("y", ly); t.setAttribute("text-anchor","middle");
    t.textContent = e.label;
    g.appendChild(t);
  }
  svg.appendChild(g); edgeEls.push(g);
}

// 节点
for (const id in NODES) {
  const n = NODES[id];
  const g = document.createElementNS(NS, "g");
  g.setAttribute("class", "node" + (["N4","N5","N7","N8"].includes(id) ? " focus" : ""));
  g.style.cursor = "pointer";
  const rect = document.createElementNS(NS, "rect");
  rect.setAttribute("x", n.x); rect.setAttribute("y", n.y);
  rect.setAttribute("width", n.w); rect.setAttribute("height", 64);
  rect.setAttribute("stroke", typeColor[n.type]);
  g.appendChild(rect);
  const name = document.createElementNS(NS, "text");
  name.setAttribute("class","t"); name.setAttribute("x", n.x + n.w/2); name.setAttribute("y", n.y + 26);
  name.setAttribute("text-anchor","middle"); name.textContent = n.name;
  g.appendChild(name);
  const sub = document.createElementNS(NS, "text");
  sub.setAttribute("class","s"); sub.setAttribute("x", n.x + n.w/2); sub.setAttribute("y", n.y + 46);
  sub.setAttribute("text-anchor","middle"); sub.textContent = n.sub;
  g.appendChild(sub);
  g.addEventListener("click", () => selectNode(id));
  svg.appendChild(g);
}

// ---------- Inspector ----------
function selectNode(id) {
  const d = DETAIL[id];
  const n = NODES[id];
  document.querySelectorAll(".node").forEach(el => el.classList.remove("sel"));
  if (d) {
    const header = document.getElementById("inspHeader");
    header.innerHTML = `<div class="id">node / ${id}</div>
      <div class="name">${d.name}</div>
      <span class="badge ${d.badge}">${d.badgeText}</span>`;
    const body = document.getElementById("inspBody");
    let html = `<div class="sec"><h4>说明</h4><p>${d.desc}</p></div>`;
    if (d.items && d.items.length) {
      html += `<div class="sec"><h4>关键参数</h4>` + d.items.map(kv =>
        `<div class="kv"><span class="k">${kv[0]}</span><span class="v">${kv[1]}</span></div>`).join("") + `</div>`;
    }
    if (d.io) html += `<div class="sec"><h4>契约</h4><div class="kv"><span class="k">输入</span><span class="v"><code>${d.io.in}</code></span></div>
      <div class="kv"><span class="k">输出</span><span class="v"><code>${d.io.out}</code></span></div></div>`;
    body.innerHTML = html;
    document.getElementById("inspFoot").innerHTML = `源自：4_大改造架构设计-v2.0.md §5.2 · 主题二讨论（Q6/Q7 已定稿）`;
  }
}

// 默认选中焦点反馈环入口 N5
selectNode("N5");
</script>
</body>
</html>
